<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PT Ladder Timer</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#08141a;font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;color:#dbe6ea;display:flex;padding:10px}
#pt{--c:#c9d6db;--bg:#10222b;flex:1;display:flex;flex-direction:column;gap:13px;background:var(--bg);border:1px solid #ffffff14;border-radius:10px;padding:18px 20px;transition:background-color .45s ease;max-width:760px;margin:auto;min-height:520px;overflow:hidden}
h1{font:500 21px/1 Oswald,system-ui;letter-spacing:.14em;text-transform:uppercase;color:#f2f7f8}
h2{font:500 11px/1 Oswald,system-ui;letter-spacing:.2em;text-transform:uppercase;color:#8ba3ad;margin-bottom:7px}
.hint{font-size:13px;color:#8ba3ad}
.scr{display:flex;flex-direction:column;gap:13px;flex:1;min-height:0}
#list{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.ex{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:7px;border:1px solid transparent;cursor:pointer}
.ex:hover{background:#ffffff0a}
.ex.on{background:#ffffff0f;border-color:#3ed59855}
.ex input{width:17px;height:17px;accent-color:#3ed598;cursor:pointer}
.ex span{font:500 15px/1 Oswald,system-ui;letter-spacing:.06em;text-transform:uppercase}
.ex.on span{color:#3ed598}
#groups{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:13px;padding-right:4px}
.pil{display:flex;gap:6px;flex-wrap:wrap}
.pil label{position:relative;padding:9px 13px;border:1px solid #ffffff2e;border-radius:6px;cursor:pointer;font:500 13px/1 Oswald,system-ui;letter-spacing:.06em;color:#8ba3ad}
.pil label:hover{background:#ffffff0a}
.pil input{position:absolute;opacity:0;width:0;height:0}
.pil input:checked+span{color:#3ed598}
.pil label:has(input:checked){border-color:#3ed598;background:#3ed5981a}
.lnk{flex:0;align-self:flex-start;padding:0;border:0;background:0;color:#5aa9e6;font:400 12px/1 system-ui;letter-spacing:0;text-transform:none;text-decoration:underline;cursor:pointer}
.lnk:hover{background:0;color:#8fc7f0}
.eye{display:flex;justify-content:space-between;align-items:center;gap:10px;font:500 12px/1 Oswald,system-ui;letter-spacing:.18em;text-transform:uppercase;color:#8ba3ad}
.pips{display:flex;gap:5px;align-items:center}
.pips b{width:9px;height:9px;border-radius:50%;background:#ffffff26;display:block}
.pips b.on{background:var(--c)}
.lad span{padding:0 6px;color:#8ba3ad}
.lad span.on{color:var(--c)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#exn{font:500 14px/1.3 Oswald,system-ui;letter-spacing:.2em;text-transform:uppercase;color:var(--c);margin-bottom:6px;text-align:center}
#phase{font:500 clamp(26px,7vw,42px)/1 Oswald,system-ui;letter-spacing:.1em;color:var(--c)}
#time{font:300 clamp(58px,18vw,112px)/.9 Oswald,system-ui;font-variant-numeric:tabular-nums;color:#f2f7f8}
#sub{font-size:13px;color:#8ba3ad;min-height:18px;text-align:center}
#track{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;justify-content:center;max-width:330px}
#track i{width:13px;height:13px;border:1.5px solid var(--c);border-radius:50%;opacity:.35}
#track.sm i{width:8px;height:8px;border-width:1px}
#track.sm{gap:5px}
#track i.done{background:var(--c);opacity:1}
#track i.now{opacity:1;box-shadow:0 0 0 3px #ffffff1a}
.bar{height:4px;background:#ffffff1a;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--c);transition:width .3s linear}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#8ba3ad}
.row{display:flex;gap:10px}
button{flex:1;font:500 15px/1 Oswald,system-ui;letter-spacing:.14em;text-transform:uppercase;padding:14px;border-radius:6px;border:1px solid var(--c);background:transparent;color:var(--c);cursor:pointer}
button:hover:not(:disabled){background:#ffffff12}
button:disabled{opacity:.35;cursor:default}
button.sec{flex:0 0 32%;border-color:#ffffff2e;color:#8ba3ad}
.opts{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:#8ba3ad}
.opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
[hidden]{display:none!important}
#pt[data-k=g]{--c:#c9d6db;--bg:#10222b}
#pt[data-k=w]{--c:#3ed598;--bg:#0f2c23}
#pt[data-k=p]{--c:#f0a93b;--bg:#2c2415}
#pt[data-k=r]{--c:#5aa9e6;--bg:#122539}
#pt[data-k=R]{--c:#a78bfa;--bg:#1d1830}
#pt[data-k=d]{--c:#3ed598;--bg:#0f2c23}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="pt" data-k="g">

 <div class="scr" id="s1">
  <h1>PT Ladder</h1>
  <p class="hint">Step 1 — check the exercises for this session.</p>
  <div id="list"></div>
  <div class="meta"><span id="cnt"></span></div>
  <div class="row"><button id="next" disabled>Next</button></div>
 </div>

 <div class="scr" id="s2" hidden>
  <h1 id="exh"></h1>
  <p class="hint" id="exsub"></p>
  <div id="groups"></div>
  <button id="all" class="lnk">Use these for the remaining exercises</button>
  <div class="meta"><span id="pat"></span><span id="est"></span></div>
  <div class="row"><button id="begin">Start session</button><button id="b1" class="sec">Back</button></div>
 </div>

 <div class="scr" id="run" hidden>
  <div class="eye"><div class="pips" id="pips"></div><div class="lad" id="lad"></div></div>
  <div class="stage">
   <div id="exn"></div><div id="phase">Ready</div><div id="time">&mdash;</div><div id="sub"></div>
   <div id="track"></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="meta"><span id="nxt"></span><span id="left"></span></div>
  <div class="row"><button id="go">Start</button><button id="b2" class="sec">Setup</button></div>
 </div>

 <div class="opts">
  <label><input type="checkbox" id="vo" checked> Spoken cues</label>
  <label><input type="checkbox" id="bp" checked> Beeps</label>
  <label><input type="checkbox" id="tk" checked> 3-2-1 ticks</label>
 </div>
</div>
<script>
/* ---- choices + defaults, from the sheet ------------------------------ */
var D={ty:'',st:'8,6,4',q:'15',qt:30,rp:10,ps:5,rs:30,ra:30};
var EXERCISES=[
 {n:'Mini Curl Up',     d:D},
 {n:'Left Side Plank',  d:D},
 {n:'Right Side Plank', d:D},
 {n:'Left Bird Dog',    d:D},
 {n:'Right Bird Dog',   d:D},
 {n:'Two Leg Hops',     d:{ty:'',st:'4',q:'15',qt:30,rp:10,ps:5,rs:30,ra:60}}
];
var GROUPS=[
 {f:'ty',t:'Type',                   v:['Reps','Time'],                    d:''},
 {f:'st',t:'Sets',                   v:['10,8,6','8,6,4','5','4','3','2','1'], d:'8,6,4'},
 {f:'q', t:'Reps per set',           v:['30','15','10'],                   d:'15', on:'Reps'},
 {f:'qt',t:'Time per set',           v:[120,90,60,30,15,10,5],             d:30,   on:'Time'},
 {f:'rp',t:'Rep hold time',          v:[60,30,15,10,5],                    d:10,   on:'Reps'},
 {f:'ps',t:'Pause time',             v:[60,30,15,10,5],                    d:5,    on:'Reps'},
 {f:'rs',t:'Rest time between sets', v:[60,30,15,10],                      d:30},
 {f:'ra',t:'Rest after exercise',    v:[240,120,60,30,15],                 d:30}
];
var LEAD=5;
/* ---------------------------------------------------------------------- */

var $=function(x){return document.getElementById(x)},pt=$('pt');
var chosen=EXERCISES.map(function(){return false;});
var CFG=EXERCISES.map(function(e){var o={};GROUPS.forEach(function(g){o[g.f]=e.d[g.f];});return o;});
var PICK=[],S=[],cum=[],tot=0,idx=0,rem=0,endAt=0,run=false,tim=null,lastTick=-1,lastX=-1,ac=null;

function fmt(x){x=Math.max(0,Math.ceil(x));return x<60?x:Math.floor(x/60)+':'+('0'+x%60).slice(-2);}
function clock(x){x=Math.max(0,Math.round(x));return Math.floor(x/60)+':'+('0'+x%60).slice(-2);}
function secs(v){return v>=60&&v%60===0?(v/60)+' min':v+'s';}
function qLabel(v){return String(v).split(',').join(' · ');}
function tLabel(v){return String(v).split(',').map(function(x){return secs(+x);}).join(' · ');}
function isT(c){return c.ty=='Time';}
function lad(v){return String(v).indexOf(',')>-1;}
function plan(c){
 var st=String(c.st).split(',').map(Number),a=[],i;
 if(isT(c)){for(i=0;i<st[0];i++)a.push(+c.qt);return a;}
 if(st.length>1)return st;
 for(i=0;i<st[0];i++)a.push(+c.q);
 return a;
}

/* ---- screen 1: which exercises ---- */
EXERCISES.forEach(function(e,n){
 var d=document.createElement('label');d.className='ex';
 d.innerHTML='<input type="checkbox"><span></span>';
 d.querySelector('span').textContent=e.n;
 var cb=d.querySelector('input');
 cb.onchange=function(){chosen[n]=cb.checked;d.classList.toggle('on',cb.checked);tally();};
 $('list').appendChild(d);
});
function tally(){
 var k=chosen.filter(Boolean).length;
 $('cnt').textContent=k?k+(k==1?' exercise':' exercises')+' selected':'Pick at least one exercise';
 $('next').disabled=!k;
}
tally();

/* ---- screen 2: one screen per exercise ---- */
var order=[],step=0;
function wizard(){
 order=[];EXERCISES.forEach(function(e,i){if(chosen[i])order.push(i);});
 step=Math.max(0,Math.min(step,order.length-1));
 var oi=order[step],c=CFG[oi];
 $('exh').textContent=EXERCISES[oi].n;
 $('exsub').textContent='Exercise '+(step+1)+' of '+order.length+' — '+
  (!c.ty?'reps or time?':isT(c)?'duration and rests':'quantity and timing');
 if(isT(c)&&lad(c.st))c.st=String(String(c.st).split(',').length);
 $('groups').innerHTML='';
 GROUPS.forEach(function(g){
  if(g.f!='ty'&&!c.ty)return;
  if(g.on&&g.on!==c.ty)return;
  if(g.f=='q'&&lad(c.st))return;
  var vals=g.f=='st'&&isT(c)?g.v.filter(function(v){return !lad(v);}):g.v;
  var box=document.createElement('div');
  box.innerHTML='<h2></h2><div class="pil"></div>';
  box.querySelector('h2').textContent=g.t;
  var pil=box.querySelector('.pil');
  vals.forEach(function(v){
   var l=document.createElement('label');
   l.innerHTML='<input type="radio" name="'+g.f+'"><span></span>';
   l.querySelector('span').textContent=g.f=='st'?qLabel(v):g.f=='q'?v:g.f=='qt'?tLabel(v):g.f=='ty'?v:secs(v);
   var rb=l.querySelector('input');rb.checked=(v===c[g.f]);
   rb.onchange=function(){CFG[oi][g.f]=v;if(g.f=='ty'||g.f=='st')wizard();else preview();};
   pil.appendChild(l);
  });
  $('groups').appendChild(box);
  if(g.f=='st'&&lad(c.st)&&!isT(c)){
   var note=document.createElement('p');note.className='hint';
   note.textContent='This ladder sets its own reps, so there\u2019s no reps question.';
   $('groups').appendChild(note);}
 });
 $('groups').scrollTop=0;
 $('begin').textContent=step<order.length-1?'Next':'Start session';
 $('b1').textContent=step?'Back':'Exercises';
 $('all').hidden=step>=order.length-1;
 preview();
}
$('all').onclick=function(){
 var src=CFG[order[step]];
 for(var j=step+1;j<order.length;j++){var o=CFG[order[j]];GROUPS.forEach(function(g){o[g.f]=src[g.f];});}
 preview();
};

/* ---- build the interval list ---- */
function build(){
 PICK=[];
 EXERCISES.forEach(function(e,i){
  if(chosen[i]&&CFG[i].ty)PICK.push({n:e.n,c:CFG[i],t:isT(CFG[i]),sets:plan(CFG[i])});
 });
 S=[{k:'g',d:LEAD,x:0,si:0}];
 for(var x=0;x<PICK.length;x++){
  var e=PICK[x],SE=e.sets;
  for(var si=0;si<SE.length;si++){var n=SE[si];
   if(e.t)S.push({k:'w',d:n,x:x,si:si,n:n,t:1});
   else for(var i=1;i<=n;i++){S.push({k:'w',d:e.c.rp,x:x,si:si,i:i,n:n});
    if(i<n)S.push({k:'p',d:e.c.ps,x:x,si:si,i:i,n:n});}
   S.push(si<SE.length-1?{k:'r',d:e.c.rs,x:x,si:si,n:n}:{k:'R',d:e.c.ra,x:x,si:si,n:n});
  }
 }
 cum=[];tot=0;S.forEach(function(s){cum.push(tot);tot+=s.d;});
}
function preview(){
 build();
 var c=CFG[order[step]];
 $('begin').disabled=!c.ty;
 if(!c.ty){$('pat').textContent='Pick Reps or Time to continue';$('est').textContent='';return;}
 var sh=isT(c)?c.st+' × '+secs(c.qt):lad(c.st)?qLabel(c.st)+' reps':c.st+' × '+c.q+' reps';
 $('pat').textContent=sh+(isT(c)?'':' · '+secs(c.rp)+' hold · '+secs(c.ps)+' pause')
  +' · '+secs(c.rs)+' / '+secs(c.ra)+' rest';
 var part=order.some(function(i){return !CFG[i].ty;});
 $('est').textContent=clock(tot)+(part?' so far':' total');
}

/* ---- audio ---- */
function tone(f,d,at){var o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;
 g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.3,at+.015);g.gain.exponentialRampToValueAtTime(.0001,at+d);
 o.connect(g);g.connect(ac.destination);o.start(at);o.stop(at+d+.05);}
function seq(list){if(!ac||!$('bp').checked)return;var t=ac.currentTime+.02;list.forEach(function(p){tone(p[0],p[1],t);t+=p[1]*.85;});}
function say(t){if(!$('vo').checked||!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.rate=1.1;speechSynthesis.speak(u);}
var CUE={g:[[523,.12]],w:[[784,.12],[1175,.16]],p:[[523,.18]],r:[[440,.14],[330,.24]],R:[[392,.14],[330,.14],[262,.32]],d:[[659,.12],[880,.12],[1175,.3]]};

/* ---- wording ---- */
var NUM=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
function spoken(d){if(d%60==0){var m=d/60;return(NUM[m]||m)+(m==1?' minute':' minutes');}return d+' seconds';}
function words(s){
 if(s.k=='g')return'Get ready. '+PICK[0].n+'.';
 if(s.k=='w')return s.t?'Go.':(NUM[s.i]||s.i)+'.';
 if(s.k=='p')return'Pause.';
 if(s.k=='r'){var nx=PICK[s.x].sets[s.si+1];
  return'Rest '+spoken(s.d)+'. Next, '+(PICK[s.x].t?spoken(nx):nx+' reps')+'.';}
 return PICK[s.x+1]?'Rest '+spoken(s.d)+'. Next, '+PICK[s.x+1].n+'.':'Rest. That was the last one.';
}
function label(s){return s.k=='w'?(s.t?'Go':'Rep '+s.i):{g:'Get ready',p:'Pause',r:'Rest',R:'Rest'}[s.k];}
function subtext(s){
 var pos=PICK.length>1?' · '+(s.x+1)+' of '+PICK.length:'';
 if(s.k=='g')return'Set 1 of '+PICK[0].sets.length+pos;
 if(s.k=='w'||s.k=='p')return'Set '+(s.si+1)+' of '+PICK[s.x].sets.length+
  ' · '+(s.t?secs(s.n):s.n+' reps')+pos;
 if(s.k=='r'){var nx=PICK[s.x].sets[s.si+1];
  return secs(s.d)+' · next: '+(PICK[s.x].t?secs(nx):'set of '+nx);}
 return PICK[s.x+1]?secs(s.d)+' · next: '+PICK[s.x+1].n:secs(s.d)+' · then you\u2019re done';
}

/* ---- render ---- */
function paint(){
 var s=S[idx];pt.dataset.k=s.k;
 if(s.x!==lastX){lastX=s.x;var e=PICK[s.x],h='';
  e.sets.forEach(function(v){h+='<span>'+(e.t?secs(v):v)+'</span>';});$('lad').innerHTML=h;}
 $('exn').textContent=PICK[s.x].n;
 $('phase').textContent=label(s);$('sub').textContent=subtext(s);$('time').textContent=fmt(rem);
 var pips=$('pips').getElementsByTagName('b'),lad=$('lad').getElementsByTagName('span');
 for(var j=0;j<pips.length;j++)pips[j].className=j<=s.x?'on':'';
 for(var j=0;j<lad.length;j++)lad[j].className=j===s.si?'on':'';
 var t='';
 if((s.k=='w'||s.k=='p')&&!s.t){for(var j=1;j<=s.n;j++)t+='<i class="'+(j<s.i?'done':j==s.i?(s.k=='p'?'done now':'now'):'')+'"></i>';}
 $('track').className=(s.n>12?'sm':'');$('track').innerHTML=t;
 var done=cum[idx]+(s.d-rem);
 $('bar').style.width=(100*done/tot)+'%';
 $('left').textContent=clock(tot-done)+' left';
 $('nxt').textContent=S[idx+1]?'Next: '+label(S[idx+1]):'Last interval';
}
function enter(){var s=S[idx];rem=s.d;endAt=performance.now()+s.d*1000;lastTick=-1;seq(CUE[s.k]);say(words(s));paint();}
function finish(){run=false;clearInterval(tim);pt.dataset.k='d';
 $('exn').textContent='';$('phase').textContent='Done';$('time').textContent='\u2713';
 $('sub').textContent=PICK.length+(PICK.length==1?' exercise':' exercises')+' complete';
 $('track').innerHTML='';$('bar').style.width='100%';$('left').textContent='';
 $('nxt').textContent='';$('go').textContent='Restart';seq(CUE.d);say('Workout complete. Nice work.');}
function tick(){
 rem=(endAt-performance.now())/1000;
 if($('tk').checked&&ac&&$('bp').checked){var w=Math.ceil(rem);if(w<=3&&w>=1&&w!==lastTick){lastTick=w;tone(660,.05,ac.currentTime+.01);}}
 if(rem<=0){idx++;if(idx>=S.length)return finish();return enter();}
 paint();
}
function arm(){
 idx=0;rem=S[0].d;endAt=0;lastTick=-1;lastX=-1;run=false;pt.dataset.k='g';
 var h='';for(var j=0;j<PICK.length;j++)h+='<b></b>';$('pips').innerHTML=h;
 h='';PICK[0].sets.forEach(function(v){h+='<span>'+(PICK[0].t?secs(v):v)+'</span>';});$('lad').innerHTML=h;
 $('go').textContent='Start';$('phase').textContent='Ready';$('time').textContent='\u2014';
 $('exn').textContent=PICK[0].n;$('sub').textContent='Press start to begin';
 $('track').innerHTML='';$('track').className='';$('bar').style.width='0';$('left').textContent='';
 $('nxt').textContent=clock(tot)+' total';
 var lad=$('lad').getElementsByTagName('span');
 for(var j=0;j<lad.length;j++)lad[j].className=j===0?'on':'';
}
function start(){
 if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
 if(ac&&ac.state=='suspended')ac.resume();
 if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){});
 if($('go').textContent=='Restart')arm();
 run=true;$('go').textContent='Pause';
 if(!endAt)enter();else endAt=performance.now()+rem*1000;
 clearInterval(tim);tim=setInterval(tick,60);
}
function hold(){run=false;clearInterval(tim);$('go').textContent='Resume';if(window.speechSynthesis)speechSynthesis.cancel();}
function show(id){['s1','s2','run'].forEach(function(v){$(v).hidden=(v!=id);});}

$('next').onclick=function(){step=0;wizard();show('s2');};
$('b1').onclick=function(){if(step){step--;wizard();}else show('s1');};
$('begin').onclick=function(){if(step<order.length-1){step++;wizard();}
 else{build();arm();show('run');}};
$('go').onclick=function(){run?hold():start()};
$('b2').onclick=function(){run=false;clearInterval(tim);if(window.speechSynthesis)speechSynthesis.cancel();
 pt.dataset.k='g';show('s1');};
document.addEventListener('keydown',function(e){if(e.code=='Space'&&e.target.tagName!='INPUT'&&e.target.tagName!='BUTTON'&&!$('run').hidden){e.preventDefault();$('go').click();}});
</script></body></html>
